name: Repo automation sync

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: repo-automation-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository files stay in sync
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            README.md
            README-backend.md
            gate.html
            index.html
            index.ts
            linked-project.json
            plan-select.html
            rjl_gate_anywhere.ino
            secrets.h.example
            setup.sql
            util.ts
          )

          for file in "${required_files[@]}"; do
            test -f "$file"
          done

          python - <<'PY'
          import json
          from pathlib import Path

          linked = json.loads(Path("linked-project.json").read_text())
          required = {"ref", "name", "organization_id", "organization_slug"}
          missing = sorted(required.difference(linked))
          if missing:
              raise SystemExit(f"linked-project.json is missing keys: {', '.join(missing)}")
          PY

          for html in index.html gate.html; do
            grep -q 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2' "$html"
            grep -q 'https://nwyrnezyzelsfvxascgf.supabase.co' "$html"
          done
