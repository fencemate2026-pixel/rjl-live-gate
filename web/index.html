<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gate Controller</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:#0f172a; color:#f1f5f9; display:flex; flex-direction:column;
      align-items:center; justify-content:center; min-height:100vh; padding:2rem; }
    h1 { font-size:1.6rem; margin-bottom:.4rem; }
    #status-bar { font-size:.9rem; color:#94a3b8; margin-bottom:1.6rem; }
    #gate-status { font-size:1.1rem; font-weight:600; padding:.5rem 1.5rem;
      border-radius:999px; margin-bottom:2rem; background:#1e293b; border:2px solid #334155; }
    input { width:260px; padding:.8rem; margin:.35rem; border-radius:10px; border:none;
      background:#1e293b; color:#fff; font-size:1rem; }
    .btn { width:220px; padding:1rem; font-size:1.2rem; font-weight:700; border:none;
      border-radius:12px; cursor:pointer; margin:.5rem; transition:transform .1s,opacity .2s; }
    .btn:active { transform:scale(.96); } .btn:disabled { opacity:.4; cursor:not-allowed; }
    #btn-open { background:#22c55e; color:#fff; } #btn-login { background:#ff6b00; color:#fff; }
    #log { margin-top:1.5rem; width:100%; max-width:400px; background:#1e293b; border-radius:12px;
      padding:1rem; font-size:.8rem; color:#94a3b8; max-height:140px; overflow-y:auto; }
    .hidden { display:none; }
    #brand { background:#fff; padding:10px 18px; border-radius:12px; margin-bottom:1rem; }
    #brand img { height:48px; width:auto; display:block; }
  </style>
</head>
<body>
  <div id="brand"><img src="https://www.rjlcommercialgroup.com/s/commercial.png" alt="RJL Commercial"></div>
  <h1>Gate Controller</h1>
  <div id="status-bar">Please sign in</div>

  <!-- LOGIN -->
  <div id="login">
    <div><input id="email" type="email" placeholder="email"></div>
    <div><input id="pass" type="password" placeholder="password"></div>
    <button class="btn" id="btn-login" onclick="signIn()">SIGN IN</button>
  </div>

  <!-- CONTROL -->
  <div id="control" class="hidden">
    <div id="gate-status">Gate: —</div>
    <button class="btn" id="btn-open" onclick="openGate()">OPEN</button>
    <div><button class="btn" style="background:#334155;width:120px;font-size:.9rem;padding:.6rem"
      onclick="signOut()">Sign out</button></div>
  </div>

  <div id="log"></div>

  <script>
    // ── Config: ONLY public values live here now. No secret. No broker creds. ──
    const SUPABASE_URL  = "https://nwyrnezyzelsfvxascgf.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53eXJuZXp5emVsc2Z2eGFzY2dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMDc0MzksImV4cCI6MjA5Nzc4MzQzOX0.9qxqrbaaeAWwtpVGDO5w4clmfbG_QWh63dMWlQuD2FE";   // public anon key (safe in client)
    const GATE_ID       = "demo-0001";
    // ───────────────────────────────────────────────────────────────────────────

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    const log = (m) => { const e=document.getElementById('log');
      e.innerHTML = `<div>${new Date().toLocaleTimeString()} — ${m}</div>` + e.innerHTML; };

    async function refresh() {
      const { data:{ session } } = await sb.auth.getSession();
      const inApp = !!session;
      document.getElementById('login').classList.toggle('hidden', inApp);
      document.getElementById('control').classList.toggle('hidden', !inApp);
      document.getElementById('status-bar').textContent = inApp ? '🟢 Signed in' : 'Please sign in';
      if (inApp) loadStatus();
    }

    async function loadStatus() {
      const { data, error } = await sb.from('gates').select('service_status').eq('id', GATE_ID).maybeSingle();
      const el = document.getElementById('gate-status');
      if (error || !data) { el.textContent = 'Gate: status unavailable'; return; }
      const s = data.service_status;
      el.textContent = s === 'suspended' ? 'Service suspended' : 'Gate: active';
      el.style.color = s === 'suspended' ? '#ef4444' : '#22c55e';
      document.getElementById('btn-open').disabled = (s === 'suspended');
    }

    async function signIn() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('pass').value;
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) { log('Sign-in failed: ' + error.message); return; }
      refresh();
    }
    async function signOut() { await sb.auth.signOut(); refresh(); }

    async function openGate() {
      log('Opening…');
      // The function signs + publishes server-side. The browser holds no secret.
      const { data, error } = await sb.functions.invoke('gate-open', { body: { gate_id: GATE_ID } });
      if (error) { log('Open failed: ' + (error.message || error)); return; }
      if (data && data.error) { log('Open refused: ' + data.error); return; }
      log('Open sent ✓');
    }

    sb.auth.onAuthStateChange(() => refresh());
    refresh();
  </script>
</body>
</html>
