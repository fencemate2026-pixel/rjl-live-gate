<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-label="PTZ joystick">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#2c3a45"/>
      <stop offset="100%" stop-color="#23303a"/>
    </radialGradient>
    <radialGradient id="ringOuter" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#5f7487"/>
      <stop offset="60%" stop-color="#2f4150"/>
      <stop offset="100%" stop-color="#1a2530"/>
    </radialGradient>
    <radialGradient id="ringInner" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1f2d38"/>
      <stop offset="100%" stop-color="#0b141c"/>
    </radialGradient>
    <radialGradient id="stick" cx="50%" cy="35%" r="58%">
      <stop offset="0%" stop-color="#4d6172"/>
      <stop offset="100%" stop-color="#1c2933"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="360" rx="14" fill="url(#bg)"/>

  <g transform="translate(300 180)">
    <circle r="118" fill="url(#ringOuter)"/>
    <circle r="86" fill="url(#ringInner)"/>
    <circle r="46" fill="url(#stick)" stroke="#617789" stroke-width="2"/>
    <circle r="4.5" fill="#d5eef8" filter="url(#glow)"/>

    <path d="M0 -104 l-10 10 h7 v8 h6 v-8 h7z" fill="#d8f1ff" filter="url(#glow)"/>
    <path d="M104 0 l-10 -10 v7 h-8 v6 h8 v7z" fill="#d8f1ff" filter="url(#glow)"/>
    <path d="M0 104 l10 -10 h-7 v-8 h-6 v8 h-7z" fill="#d8f1ff" filter="url(#glow)"/>
    <path d="M-104 0 l10 10 v-7 h8 v-6 h-8 v-7z" fill="#d8f1ff" filter="url(#glow)"/>
  </g>
</svg>
